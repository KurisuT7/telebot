name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Release package
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          sh scripts/release/package.sh x86_64-unknown-linux-gnu x86_64
          sh scripts/release/verify-package.sh dist/telebot-linux-x86_64.tar.gz x86_64
          sh scripts/release/verify-prepare-install.sh \
            dist/telebot-linux-x86_64.tar.gz x86_64

  arm64-package:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Toolchain
        run: rustup show
      - name: Release package
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-gnu
          sh scripts/release/package.sh aarch64-unknown-linux-gnu aarch64
          sh scripts/release/verify-package.sh dist/telebot-linux-aarch64.tar.gz aarch64
          sh scripts/release/verify-prepare-install.sh \
            dist/telebot-linux-aarch64.tar.gz aarch64
