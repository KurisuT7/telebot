[telegram]
api_id = 0
api_hash_env = "TELEBOT_TELEGRAM_API_HASH"
session_path = "/var/lib/telebot/telegram.session"
command_prefixes = [".", "。", ",", "，", "$", "!", "！"]
catch_up = true
max_parallel_commands = 8

[storage]
path = "/var/lib/telebot/telebot.db"

[ai]
enabled = true
provider = "gemini"
api_format = "gemini_interactions"
api_key_env = "TELEBOT_AI_API_KEY"
base_url = "https://generativelanguage.googleapis.com"
model = "gemini-3.7-flash"
# Leave empty to hedge with the primary model, or set a different search model.
search_fallback_model = ""
thinking_level = "low"
default_search = true
system_prompt = "请使用中文准确、简洁地回答。使用联网搜索时优先采用可靠来源，并明确区分事实与推断。"
# Rolling context turns per chat. Set to 0 to disable; .ai context can change it at runtime.
history_turns = 0
collapse_long_messages = true
# Retained for compatibility with older configuration files.
collapse_threshold_chars = 400
max_output_tokens = 4096
max_concurrent = 3
search_timeout_seconds = 20
# Image search has a separate total timeout; text search keeps the shorter limit above.
image_search_timeout_seconds = 30
# Start one parallel retry after this delay. Set to 0 to disable hedging.
search_hedge_seconds = 3
fallback_timeout_seconds = 10

[messages]
ai_searching = "🔎 正在搜索…"
ai_thinking = "💭 正在思考…"

[quote]
enabled = false
api_url = "http://127.0.0.1:3210/generate"
timeout_seconds = 20
max_messages = 5
background_color = "#1b1429"
sticker_set_short_name = ""
# When enabled, archive newly generated quotes and evict the oldest entries at either limit.
history_enabled = false
history_limit = 100
history_max_bytes = 104857600
