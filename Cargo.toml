[package]
name = "telebot"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "A small, reliable Telegram user client with modular commands"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3.32"
grammers-client = { version = "0.10.0", features = ["fs"] }
grammers-mtsender = "0.10.0"
grammers-session = "0.10.0"
grammers-tl-types = "0.10.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tokio = { version = "1.52", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
